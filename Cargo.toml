[package]
name = "luma"
version = "0.1.0"
rust-version = "1.88"
edition = "2021"
description = "Luma — Themeable terminal UI for Ollama, with a Hugging Face model marketplace"
readme = "README.md"

repository = "https://github.com/design-nexus/luma"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
notify = "8"
ratatui = { version = "=0.30.2", features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
